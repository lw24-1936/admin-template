version: 2
updates:
  - package-ecosystem: maven
    directory: /admintem-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /admintem-vue
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /admintem-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /admintem-uniapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uniapp-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /admintem-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
