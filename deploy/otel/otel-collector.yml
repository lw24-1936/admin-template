# 最小 OpenTelemetry Collector 配置（本地/演示）
#
# 后端开启 tracing 后向 http://<collector>:4318/v1/traces 导出 OTLP/HTTP。
# 生产请把 exporters 换成实际后端（Jaeger/Tempo/商业 APM），并配置采样与鉴权。
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
